# Brain's Supabase settings, kept tight and in Git so they can be reviewed.
# Local use: `supabase start` (from the repo root).
# Remote use: `supabase config diff --project-ref iihjcqiiavleyheqzotl`, review, then `supabase config push`.
# Brain is one page talking to one database. Anything the page does not use is switched off.
project_id = "Nodes"

[api]
enabled = true
# Brain's data lives in `public`, `graphql_public` is deliberately left out: Brain has no GraphQL
# client, and a second API surface would need its own access rules.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# The page reads at most 60 access-log rows and a handful of profiles at a time.
max_rows = 200
# New tables must be granted to the Data API roles on purpose. Supabase's cloud default is the
# opposite (grant first, ask later), which is how readable tables are exposed by accident.
auto_expose_new_tables = false

# Brain connects from the page and the Edge Function over HTTPS only, never with a direct Postgres
# connection. Once Owner stops running `supabase db push` from his own network, enable this with no
# allowed CIDRs (that blocks every direct connection) - see supabase/README.md.
# [db.network_restrictions]
# enabled = true
# allowed_cidrs = []
# allowed_cidrs_v6 = []

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match the remote project (17).
major_version = 17

[db.migrations]
enabled = false

# ---------------------------------------------------------------------------------------------------
# DO NOT RUN `supabase config push` YET. A push replaces the project's whole auth section, and any
# auth key left out of this file falls back to the CLI default.
# Before anyone runs it, the owner must copy `site_url` and `additional_redirect_urls` from the
# dashboard (Auth -> URL Configuration) into [auth] below. They are not public, so they are not
# guessed here. Also copy the other auth values that are not listed here (token expiry, password
# length, rate limits, email and MFA settings) from the dashboard. Nobody runs `config push` until then.
#
# Values below were verified on Oct 31 2026 against the live public auth settings
# (GET /auth/v1/settings: disable_signup = true; email = true; phone, anonymous and every
# other provider = false; mailer_autoconfirm = false; phone_autoconfirm = false).
# ---------------------------------------------------------------------------------------------------
[auth]
enabled = true
# Accounts exist only when an admin makes one through Brain's accounts function.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# This switch is the email PROVIDER (live: email = true). It must stay true or nobody can sign in;
# new sign-ups are still refused by `enable_signup = false` above.
enable_signup = true
# live: mailer_autoconfirm = false
enable_confirmations = true

[auth.sms]
# live: phone = false, phone_autoconfirm = false
enable_signup = false
enable_confirmations = true
